[package]
name = "argo-projectiond"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Hardware builds opt in explicitly. The dependency is kept out of ordinary
# desktop/test builds, which exercise the transport through the fake seam.
linux-usb = ["dep:futures-lite", "dep:nusb"]
linux-media = ["dep:gstreamer", "dep:gstreamer-app"]

[dependencies]
nusb = { version = "0.2.7", features = ["tokio"], optional = true }
tokio = { version = "1.47", features = ["io-util", "process", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
futures-lite = { version = "2.6", optional = true }
rustls = { version = "=0.23.22", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures-util = "0.3.34"
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "0.24", optional = true }
gstreamer-app = { version = "0.24", optional = true }

[dev-dependencies]
tokio = { version = "1.47", features = ["test-util"] }
